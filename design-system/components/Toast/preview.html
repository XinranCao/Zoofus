<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title>
<style>html,body{margin:0} body{min-height:100vh} .row{display:flex;flex-wrap:wrap;gap:22px;align-items:center} .col{display:grid;gap:10px;justify-items:start} .cap{font-family:var(--font-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}</style></head>
<body class="zf-ground zf-root">
<div id="root" style="padding:28px"></div>
<script>
var Z = window.Zoofus, h = React.createElement, F = React.Fragment;
function L(label, el) { return h('div', { className: 'col' }, h('span', { className: 'cap' }, label), el); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{alignItems:'start',gap:30,paddingTop:8}}, h(Z.Toast,{kind:'success',title:'Saved to your book',seed:'t1'},'“Pear” is on page 3.'), h(Z.Toast,{kind:'error',title:'We couldn’t open that file',seed:'t2'},'Try a PNG, JPG or HEIC under 20 MB.'), h(Z.Toast,{kind:'info',title:'Signed out',seed:'t3'},'See you soon.')));
</script>
</body>
</html>
